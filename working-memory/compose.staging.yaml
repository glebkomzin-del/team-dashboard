services:
  memory-staging:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8797:8791'
    env_file: .local/service.env
    volumes:
      - ./.local:/app/.local:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
