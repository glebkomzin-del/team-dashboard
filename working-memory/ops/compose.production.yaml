services:
  canonical-draft:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8798:8791'
    env_file: .local/service.env
    volumes:
      - ./.local/cache:/app/.local:rw
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health',timeout=10)"]
      interval: 60s
      timeout: 12s
      retries: 3
